# Push naar `dev`  -> tasks-dev.sommetmedia.nl  (map ~/takenbord/dev  op de server)
# Push naar `main` -> tasks.sommetmedia.nl      (map ~/takenbord/prod op de server)
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   CPANEL_HOST      45.152.249.10
#   CPANEL_USER      cPanel-gebruikersnaam
#   CPANEL_SSH_KEY   privé SSH-sleutel (de publieke sleutel staat in cPanel > SSH Access)
#   CPANEL_SSH_PORT  SSH-poort (vaak 22, bij sommige hosts anders)
#   CPANEL_SSH_PASSPHRASE  wachtwoord van de sleutel (alleen als die er een heeft)
#   APP_PASSWORD     wachtwoord van het takenbord (gebruikersnaam: sommet)
#   ANTHROPIC_API_KEY  Claude API-sleutel voor "taak uit tekst" (optioneel)
#
# De server is gewone shared hosting (PHP + Apache, geen Node.js). De build zet:
#   ~/takenbord/<prod|dev>/public/  document root van het subdomein (frontend + api.php)
#   ~/takenbord-data/<prod|dev>/    de taken, buiten de deploy-map
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      READY: ${{ secrets.CPANEL_SSH_KEY != '' && secrets.CPANEL_HOST != '' && secrets.CPANEL_USER != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run package

      - name: Nog geen server-gegevens
        if: env.READY != 'true'
        run: echo "::notice::Build gelukt, maar CPANEL_HOST, CPANEL_USER of CPANEL_SSH_KEY ontbreekt nog. Niet gedeployed."

      - name: SSH-sleutel laden
        if: env.READY == 'true'
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Wachtwoord van de sleutel (cPanel dwingt er een af) via askpass, zonder dat het in de log komt.
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass
          chmod 700 ~/.ssh/askpass
          ok=true
          SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0 timeout 20 ssh-add ~/.ssh/deploy_key < /dev/null || ok=false
          rm -f ~/.ssh/deploy_key ~/.ssh/askpass
          if [ "$ok" != true ]; then
            echo "::error::SSH-sleutel niet geladen. Klopt CPANEL_SSH_PASSPHRASE, en is CPANEL_SSH_KEY de volledige private key?"
            exit 1
          fi

      - name: Upload naar de server
        if: env.READY == 'true'
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Secret APP_PASSWORD ontbreekt. Zonder wachtwoord wordt het bord niet online gezet."
            exit 1
          fi
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          REMOTE_HOME=$(ssh -p "$PORT" "$USER@$HOST" 'printf %s "$HOME"')
          APP_DIR="$REMOTE_HOME/takenbord/$TARGET"
          # Wachtwoordbestand (gebruiker "sommet") buiten de document root, pad invullen in .htaccess.
          printf 'sommet:%s\n' "$(openssl passwd -apr1 -stdin <<< "$APP_PASSWORD")" > build/.htpasswd
          sed -i "s|__HTPASSWD__|$APP_DIR/.htpasswd|" build/public/.htaccess
          # Claude-sleutel voor "taak uit tekst" (optioneel), alleen leesbaar voor de eigen gebruiker.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            (umask 077; printf '%s' "$ANTHROPIC_API_KEY" > build/anthropic.key)
          else
            echo "::notice::Secret ANTHROPIC_API_KEY ontbreekt: 'taak uit tekst' staat uit."
          fi
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p takenbord/$TARGET takenbord-data/$TARGET"
          rsync -az --delete --chmod=D755,F644 \
            --exclude /public/.well-known/ --exclude /public/cgi-bin/ --exclude error_log \
            -e "ssh -p $PORT" build/ "$USER@$HOST:takenbord/$TARGET/"
          ssh -p "$PORT" "$USER@$HOST" "chmod 600 takenbord/$TARGET/anthropic.key 2>/dev/null; chmod 644 takenbord/$TARGET/.htpasswd; true"
